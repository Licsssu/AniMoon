<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой аниме-сайт (Anilibria)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #ff6b6b; }
        #anime-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .anime-card {
            background: #1e1e1e;
            border-radius: 8px;
            width: 200px;
            padding: 15px;
            text-align: left;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .anime-card:hover { transform: scale(1.05); }
        .anime-card img {
            width: 100%;
            border-radius: 4px;
            height: 280px;
            object-fit: cover;
        }
        .anime-card h3 {
            font-size: 16px;
            margin: 10px 0 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #player-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            width: 85%;
            max-width: 900px;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #ff6b6b;
        }
        iframe {
            width: 100%;
            height: 500px;
            border: none;
            border-radius: 6px;
            margin-top: 15px;
            background: #000;
        }
    </style>
</head>
<body>

    <h1>Мои любимые релизы (Anilibria)</h1>
    <p>Нажмите на карточку аниме, чтобы открыть плеер</p>
    
    <div id="anime-container">Загрузка данных с Анилибрии...</div>

    <!-- Модальное окно с плеером Анилибрии -->
    <div id="player-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closePlayer()">&times;</span>
            <h2 id="modal-title">Название аниме</h2>
            <!-- Сюда подгрузится реальный плеер -->
            <iframe id="anime-player" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        async function loadAnime() {
            try {
                // Запрашиваем 12 последних обновленных тайтлов с Анилибрии
                const response = await fetch('https://api.anilibria.tv/v3/title/updates?limit=12');
                const data = await response.json();
                const animeList = data.list; 
                
                const container = document.getElementById('anime-container');
                container.innerHTML = ''; 
                
                animeList.forEach(anime => {
                    const card = document.createElement('div');
                    card.className = 'anime-card';
                    
                    // Анилибрия отдает неполную ссылку на картинку, собираем ее:
                    const posterUrl = `https://anilibria.tv${anime.posters.original.url}`;
                    
                    card.innerHTML = `
                        <img src="${posterUrl}" alt="${anime.names.ru}">
                        <h3>${anime.names.ru}</h3>
                    `;
                    
                    card.addEventListener('click', () => {
                        // Передаем название и уникальный ID аниме для плеера
                        openPlayer(anime.names.ru, anime.id);
                    });

                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Ошибка:', error);
                document.getElementById('anime-container').innerHTML = 
                    '<p style="color:#ff6b6b;">Ошибка загрузки. Включи VPN, возможно провайдер блокирует Анилибрию!</p>';
            }
        }

        function openPlayer(title, animeId) {
            document.getElementById('modal-title').innerText = title;
            const player = document.getElementById('anime-player');
            
            // Вставляем родной iframe-плеер Анилибрии
            player.src = `https://anilibria.tv/public/iframe.php?id=${animeId}`;
            
            document.getElementById('player-modal').style.display = 'flex';
        }

        function closePlayer() {
            const player = document.getElementById('anime-player');
            player.src = ""; // Выключаем звук/видео при закрытии
            document.getElementById('player-modal').style.display = 'none';
        }

        loadAnime();
    </script>

</body>
</html>
