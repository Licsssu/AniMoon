<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой аниме-сайт (Collapse)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #ff6b6b; }
        #anime-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .anime-card {
            background: #1e1e1e;
            border-radius: 8px;
            width: 200px;
            padding: 15px;
            text-align: left;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .anime-card:hover { transform: scale(1.05); }
        .anime-card img {
            width: 100%;
            border-radius: 4px;
            height: 280px;
            object-fit: cover;
        }
        .anime-card h3 {
            font-size: 16px;
            margin: 10px 0 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #player-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            width: 85%;
            max-width: 900px;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #ff6b6b;
        }
        iframe {
            width: 100%;
            height: 500px;
            border: none;
            border-radius: 6px;
            margin-top: 15px;
            background: #000;
        }
        .error-msg { color: #ff6b6b; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Мой аниме-каталог (Collapse Player)</h1>
    <p>Нажмите на карточку аниме, чтобы открыть плеер</p>
    
    <div id="anime-container">Загрузка данных с Shikimori...</div>

    <!-- Модальное окно плеера -->
    <div id="player-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closePlayer()">&times;</span>
            <h2 id="modal-title">Название аниме</h2>
            <iframe id="anime-player" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        async function loadAnime() {
            try {
                // Пытаемся получить список аниме с Шикимори
                const response = await fetch('https://shikimori.me/api/animes?limit=12&order=popularity');
                
                if (!response.ok) throw new Error('Shikimori заблокировал запрос');
                
                const data = await response.json();
                const container = document.getElementById('anime-container');
                container.innerHTML = ''; 
                
                data.forEach(anime => {
                    const card = document.createElement('div');
                    card.className = 'anime-card';
                    card.innerHTML = `
                        <img src="https://shikimori.me${anime.image.original}" alt="${anime.russian}">
                        <h3>${anime.russian || anime.name}</h3>
                        <p>Год: ${anime.aired_on ? anime.aired_on.slice(0, 4) : 'Н/Д'}</p>
                    `;
                    
                    card.addEventListener('click', () => {
                        // Передаем в плеер название и уникальный ID Шикимори
                        openPlayer(anime.russian || anime.name, anime.id);
                    });

                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Ошибка:', error);
                document.getElementById('anime-container').innerHTML = 
                    `<p class="error-msg">Ошибка загрузки каталога! <br><br> 
                    Скорее всего, твой AdBlock, uBlock или встроенная защита браузера блокирует доступ к shikimori.me. <br> 
                    Отключи блокировщик для этого сайта и обнови страницу.</p>`;
            }
        }

        function openPlayer(title, shikimoriId) {
            document.getElementById('modal-title').innerText = title;
            const player = document.getElementById('anime-player');
            
            // Вставляем ссылку на Collapse. 
            // Обрати внимание: домены у плееров часто меняются из-за блокировок.
            // Если этот домен отвалится в будущем, тебе просто нужно будет заменить "api.collapse.party" на их актуальный домен.
            player.src = `https://api.collapse.party/embed/anime/${shikimoriId}`;
            
            document.getElementById('player-modal').style.display = 'flex';
        }

        function closePlayer() {
            const player = document.getElementById('anime-player');
            player.src = ""; 
            document.getElementById('player-modal').style.display = 'none';
        }

        loadAnime();
    </script>

</body>
</html>
