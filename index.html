<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Тест плеера</title>
    <!-- Видео.js -->
    <link href="https://vjs.zencdn.net/8.23.3/video-js.css" rel="stylesheet">
    <style>
        body { background: #121212; color: white; text-align: center; padding: 20px; }
        button { padding: 12px 24px; font-size: 18px; cursor: pointer; }
        .video-container { max-width: 800px; margin: 20px auto; }
    </style>
</head>
<body>
    <h1>🎬 Тест плеера</h1>
    <button onclick="openVideo()">Открыть видео</button>

    <div id="playerContainer" style="display:none;" class="video-container">
        <video id="myVideo" class="video-js vjs-default-skin" controls
               data-setup='{"fluid": true, "controls": true}'>
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        </video>
    </div>

    <script src="https://vjs.zencdn.net/8.23.3/video.min.js"></script>
    <script>
        let player = null;

        function openVideo() {
            const container = document.getElementById('playerContainer');
            container.style.display = 'block';

            if (!player) {
                player = videojs('myVideo', {
                    fluid: true,
                    controls: true,
                    autoplay: true
                });
            }
        }
    </script>
</body>
</html>
