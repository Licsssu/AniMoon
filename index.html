<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniMoon | На базе Anilibria API</title>

    <!-- Шрифты и Иконки -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Video.js для кастомного плеера -->
    <link href="https://vjs.zencdn.net/8.5.2/video-js.css" rel="stylesheet" />

    <style>
        /* === Базовые стили === */
        :root {
            --bg-color: #0a0e17; --card-bg: #1a2236; --card-hover: #232d47;
            --neon-purple: #a855f7; --neon-blue: #3b82f6;
            --text-main: #f3f4f6; --text-muted: #9ca3af;
            --glass-bg: rgba(26, 34, 54, 0.7); --glass-border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--card-bg); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-purple); }

        /* === Шапка === */
        header {
            position: sticky; top: 0; z-index: 50; background: var(--glass-bg);
            backdrop-filter: blur(12px); border-bottom: 1px solid var(--glass-border);
            padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; gap: 1rem;
        }
        .logo { font-size: 1.8rem; font-weight: 800; color: var(--text-main); text-decoration: none; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; text-shadow: 0 0 10px rgba(168, 85, 247, 0.4); }
        .logo i { color: var(--neon-purple); }
        
        .search-box { position: relative; flex: 1; max-width: 400px; }
        .search-box input { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border); color: var(--text-main); padding: 0.6rem 1rem 0.6rem 2.5rem; border-radius: 20px; outline: none; transition: 0.3s; }
        .search-box input:focus { border-color: var(--neon-purple); box-shadow: 0 0 10px rgba(168, 85, 247, 0.3); }
        .search-box i { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        /* === Каталог === */
        .controls-section { padding: 2rem 5% 0.5rem; display: flex; justify-content: space-between; align-items: center; }
        .results-count { color: var(--text-muted); font-size: 0.9rem; }
        
        .catalog { padding: 1rem 5% 3rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.5rem; }
        
        .anime-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; position: relative; cursor: pointer; border: 1px solid transparent; transition: 0.3s; }
        .anime-card:hover { transform: translateY(-8px); border-color: var(--neon-purple); box-shadow: 0 10px 25px rgba(168, 85, 247, 0.2); }
        .card-poster { width: 100%; height: 300px; object-fit: cover; border-bottom: 2px solid var(--neon-purple); }
        .card-badges { position: absolute; top: 0.5rem; left: 0.5rem; right: 0.5rem; display: flex; justify-content: space-between; pointer-events: none; }
        .badge { background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 700; color: #fff; }
        .badge.type { background: var(--neon-blue); }
        
        .card-info { padding: 1rem; }
        .card-title { font-size: 1rem; font-weight: 600; margin-bottom: 0.5rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-meta { font-size: 0.8rem; color: var(--text-muted); display: flex; justify-content: space-between; }

        .loader { grid-column: 1/-1; text-align: center; color: var(--neon-purple); font-size: 2rem; padding: 2rem; }

        /* === Модальное окно плеера === */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 14, 23, 0.95); backdrop-filter: blur(8px);
            z-index: 100; display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: 0.3s; padding: 1rem;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content {
            background: var(--card-bg); border: 1px solid var(--glass-border); border-radius: 16px; width: 100%; max-width: 1200px; max-height: 90vh; display: flex; flex-direction: row; overflow: hidden; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.8); transform: scale(0.95); transition: 0.3s;
        }
        .modal-overlay.active .modal-content { transform: scale(1); }

        .close-btn { position: absolute; top: 1rem; right: 1rem; background: rgba(0,0,0,0.5); color: #fff; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; z-index: 110; transition: 0.3s; }
        .close-btn:hover { background: var(--neon-purple); transform: rotate(90deg); }

        .modal-left { flex: 1; display: flex; flex-direction: column; overflow-y: auto; border-right: 1px solid var(--glass-border); }
        .video-container { width: 100%; aspect-ratio: 16 / 9; background: #000; }
        
        .video-js { width: 100%; height: 100%; }
        .vjs-default-skin .vjs-play-progress, .vjs-slider-bar { background-color: var(--neon-purple) !important; }
        .vjs-volume-level { background-color: var(--neon-blue) !important; }
        
        .modal-info { padding: 1.5rem; }
        .modal-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
        .modal-tags { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .modal-tags span { background: rgba(255,255,255,0.05); padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.8rem; color: var(--text-muted); }
        .modal-synopsis { font-size: 0.95rem; line-height: 1.6; color: #d1d5db; }

        .modal-right { width: 300px; display: flex; flex-direction: column; background: rgba(0,0,0,0.3); }
        .controls-header { padding: 1.5rem; border-bottom: 1px solid var(--glass-border); font-weight: bold; color: var(--neon-purple); }
        .episodes-container { padding: 1rem; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 0.5rem; }
        
        .ep-btn {
            background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border);
            color: var(--text-main); padding: 0.8rem 1rem; border-radius: 8px;
            text-align: left; cursor: pointer; transition: 0.2s;
            display: flex; justify-content: space-between; align-items: center; font-weight: 500;
        }
        .ep-btn:hover { background: rgba(255,255,255,0.1); }
        .ep-btn.active {
            background: rgba(168, 85, 247, 0.15); border-color: var(--neon-purple);
            color: var(--neon-purple); box-shadow: inset 0 0 10px rgba(168,85,247,0.2);
        }

        @media (max-width: 900px) {
            .modal-content { flex-direction: column; }
            .modal-right { width: 100%; border-top: 1px solid var(--glass-border); height: 300px; }
            .modal-left { overflow-y: visible; }
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header>
        <a href="#" class="logo" onclick="fetchRecentReleases()">
            <i class="fa-solid fa-moon"></i> AniMoon
        </a>
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Поиск по базе Anilibria...">
        </div>
    </header>

    <section class="controls-section">
        <h2 id="sectionTitle">Последние релизы (Anilibria)</h2>
        <div class="results-count" id="resultsCounter">Загрузка...</div>
    </section>

    <!-- Сетка Аниме -->
    <main class="catalog" id="animeGrid">
        <div class="loader"><i class="fa-solid fa-circle-notch fa-spin"></i> Подключение к базе...</div>
    </main>

    <!-- Плеер (Модальное Окно) -->
    <div class="modal-overlay" id="playerModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            
            <div class="modal-left">
                <div class="video-container">
                    <video id="anime-player" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto"></video>
                </div>
                <div class="modal-info">
                    <h2 class="modal-title" id="m-title">Название</h2>
                    <div class="modal-tags">
                        <span id="m-status">Статус</span>
                        <span id="m-year">Год</span>
                        <span id="m-genres">Жанры</span>
                    </div>
                    <p class="modal-synopsis" id="m-synopsis">Описание</p>
                </div>
            </div>

            <div class="modal-right">
                <div class="controls-header">
                    <i class="fa-solid fa-list"></i> Список серий
                </div>
                <div class="episodes-container" id="episodesList">
                    <!-- Кнопки серий генерируются динамически -->
                </div>
            </div>
        </div>
    </div>

    <!-- Скрипт Video.js для работы с HLS -->
    <script src="https://vjs.zencdn.net/8.5.2/video.min.js"></script>

    <script>
        // API Anilibria v3
        const API_BASE = 'https://api.anilibria.tv/v3';
        const IMG_HOST = 'https://anilibria.tv';

        let vjsPlayer = null;
        let searchTimeout = null;

        // Инициализация при загрузке
        document.addEventListener('DOMContentLoaded', () => {
            // Video.js по умолчанию поддерживает HLS (m3u8 файлы)
            vjsPlayer = videojs('anime-player', {
                fluid: true,
                playbackRates: [1, 1.25, 1.5, 2]
            });
            
            fetchRecentReleases();

            // Живой поиск с задержкой (чтобы не спамить API при каждом нажатии клавиши)
            document.getElementById('searchInput').addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                const query = e.target.value.trim();
                
                if (query.length > 2) {
                    searchTimeout = setTimeout(() => searchAnime(query), 800);
                } else if (query.length === 0) {
                    fetchRecentReleases();
                }
            });

            // Закрытие модалки
            document.getElementById('playerModal').addEventListener('click', (e) => {
                if (e.target.id === 'playerModal') closeModal();
            });
        });

        // Получить последние релизы
        async function fetchRecentReleases() {
            document.getElementById('sectionTitle').innerText = 'Последние обновления';
            document.getElementById('searchInput').value = '';
            showLoader();
            try {
                const response = await fetch(`${API_BASE}/title/changes?limit=24`);
                const data = await response.json();
                renderGrid(data.list);
            } catch (error) {
                showError('Не удалось загрузить данные с серверов Anilibria');
            }
        }

        // Поиск по базе
        async function searchAnime(query) {
            document.getElementById('sectionTitle').innerText = `Результаты поиска: ${query}`;
            showLoader();
            try {
                const response = await fetch(`${API_BASE}/title/search?search=${encodeURIComponent(query)}&limit=24`);
                const data = await response.json();
                renderGrid(data.list);
            } catch (error) {
                showError('Ошибка при поиске');
            }
        }

        // Отрисовка сетки
        function renderGrid(animeList) {
            const grid = document.getElementById('animeGrid');
            const counter = document.getElementById('resultsCounter');
            grid.innerHTML = '';

            if (!animeList || animeList.length === 0) {
                grid.innerHTML = '<div class="loader">Ничего не найдено 😔</div>';
                counter.innerText = 'Найдено: 0';
                return;
            }

            counter.innerText = `Показано: ${animeList.length} тайтлов`;

            animeList.forEach(anime => {
                const card = document.createElement('div');
                card.className = 'anime-card';
                
                // Достаем нужные поля из ответа API Анилибрии
                const title = anime.names.ru || anime.names.en;
                const img = IMG_HOST + anime.posters.original.url;
                const status = anime.status.string;
                const season = anime.season.year;
                
                card.innerHTML = `
                    <div class="card-badges">
                        <span class="badge type">${status}</span>
                    </div>
                    <img class="card-poster" src="${img}" alt="${title}" loading="lazy">
                    <div class="card-info">
                        <h3 class="card-title">${title}</h3>
                        <div class="card-meta">
                            <span>${season} г.</span>
                            <span>Anilibria</span>
                        </div>
                    </div>
                `;
                
                // Клик по карточке
                card.addEventListener('click', () => openModal(anime));
                grid.appendChild(card);
            });
        }

        function showLoader() {
            document.getElementById('animeGrid').innerHTML = '<div class="loader"><i class="fa-solid fa-circle-notch fa-spin"></i> Обработка запроса...</div>';
        }

        function showError(msg) {
            document.getElementById('animeGrid').innerHTML = `<div class="loader" style="color: #ef4444;">${msg}</div>`;
        }

        // === ПЛЕЕР И МОДАЛКА ===
        function openModal(anime) {
            const modal = document.getElementById('playerModal');
            
            // Текстовая информация
            document.getElementById('m-title').innerText = anime.names.ru || anime.names.en;
            document.getElementById('m-status').innerText = `Статус: ${anime.status.string}`;
            document.getElementById('m-year').innerText = `Год: ${anime.season.year}`;
            document.getElementById('m-genres').innerText = anime.genres ? anime.genres.join(', ') : '';
            
            // Очистка HTML-тегов из описания Анилибрии
            const tempDiv = document.createElement("div");
            tempDiv.innerHTML = anime.description || 'Описание отсутствует.';
            document.getElementById('m-synopsis').innerText = tempDiv.textContent || tempDiv.innerText || "";

            // Парсинг серий
            renderEpisodesList(anime.player);
            
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('playerModal').classList.remove('active');
            document.body.style.overflow = '';
            if (vjsPlayer) { 
                vjsPlayer.pause(); 
                vjsPlayer.currentTime(0); 
            }
        }

        // Рендер кнопок серий
        function renderEpisodesList(playerData) {
            const listContainer = document.getElementById('episodesList');
            listContainer.innerHTML = '';

            // playerData.list содержит объекты серий (ключи - номера серий)
            const episodes = Object.values(playerData.list);
            
            if (episodes.length === 0) {
                listContainer.innerHTML = '<div style="padding:1rem; color:#9ca3af;">Серии еще не загружены</div>';
                return;
            }

            const host = playerData.host; // хост для HLS потока

            episodes.forEach(ep => {
                const btn = document.createElement('button');
                btn.className = 'ep-btn';
                
                // Название серии (например: "Серия 1" или "Фильм")
                const epName = ep.name ? ep.name : `Серия ${ep.episode}`;
                
                btn.innerHTML = `<span>${epName}</span> <i class="fa-solid fa-play" style="font-size: 0.8em; opacity: 0.5;"></i>`;
                
                btn.addEventListener('click', () => {
                    // Подсветка активной кнопки
                    document.querySelectorAll('.ep-btn').forEach(b => {
                        b.classList.remove('active');
                        b.querySelector('i').style.opacity = '0.5';
                    });
                    btn.classList.add('active');
                    btn.querySelector('i').style.opacity = '1';

                    // Формируем прямую ссылку на HLS поток (.m3u8).
                    // Берем лучшее доступное качество: fhd (1080p), hd (720p) или sd (480p)
                    const hlsPath = ep.hls.fhd || ep.hls.hd || ep.hls.sd;
                    const videoUrl = `https://${host}${hlsPath}`;

                    // Загружаем поток в плеер
                    playHlsStream(videoUrl);
                });

                listContainer.appendChild(btn);
            });

            // Автоматически включаем первую доступную серию
            const firstBtn = listContainer.querySelector('.ep-btn');
            if (firstBtn) firstBtn.click();
        }

        // Запуск потока в Video.js
        function playHlsStream(url) {
            if (vjsPlayer) {
                vjsPlayer.src({
                    src: url,
                    type: 'application/x-mpegURL' // MIME-тип для HLS
                });
                vjsPlayer.play().catch(e => console.log('Автовоспроизведение заблокировано браузером', e));
            }
        }
    </script>
</body>
</html>
