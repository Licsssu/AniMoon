<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniMoon — Твой аниме каталог</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #8a2be2; } /* Фиолетовый цвет AniMoon */
        #anime-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .anime-card {
            background: #1e1e1e;
            border-radius: 8px;
            width: 200px;
            padding: 15px;
            text-align: left;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .anime-card:hover { transform: scale(1.05); }
        .anime-card img {
            width: 100%;
            border-radius: 4px;
            height: 280px;
            object-fit: cover;
        }
        .anime-card h3 {
            font-size: 16px;
            margin: 10px 0 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #player-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            width: 85%;
            max-width: 900px;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #ff6b6b;
        }
        iframe {
            width: 100%;
            height: 500px;
            border: none;
            border-radius: 6px;
            margin-top: 15px;
            background: #000;
        }
    </style>
</head>
<body>

    <h1>AniMoon 🌙</h1>
    <p>Выбери аниме для просмотра</p>
    
    <div id="anime-container">Загрузка базы данных...</div>

    <!-- Модальное окно плеера -->
    <div id="player-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closePlayer()">&times;</span>
            <h2 id="modal-title">Название аниме</h2>
            <!-- Плеер от Collapse -->
            <iframe id="anime-player" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // Загружаем каталог аниме (с обходом блокировок через прокси)
        async function loadAnime() {
            try {
                const targetApiUrl = 'https://shikimori.one/api/animes?limit=12&order=popularity';
                const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(targetApiUrl);
                
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                const container = document.getElementById('anime-container');
                container.innerHTML = ''; 
                
                data.forEach(anime => {
                    const card = document.createElement('div');
                    card.className = 'anime-card';
                    card.innerHTML = `
                        <img src="https://shikimori.one${anime.image.original}" alt="${anime.russian}">
                        <h3>${anime.russian || anime.name}</h3>
                        <p style="color: gray; font-size: 14px;">Год: ${anime.aired_on ? anime.aired_on.slice(0, 4) : 'Н/Д'}</p>
                    `;
                    
                    card.addEventListener('click', () => {
                        openPlayer(anime.russian || anime.name, anime.id);
                    });

                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Ошибка:', error);
                document.getElementById('anime-container').innerHTML = '<p>Не удалось загрузить базу. Попробуй обновить страницу.</p>';
            }
        }

        // Запуск плеера Collapse по клику
        function openPlayer(title, shikimoriId) {
            document.getElementById('modal-title').innerText = title;
            const player = document.getElementById('anime-player');
            
            // Вставляем ссылку Collapse, которая сразу ищет видео по ID Шикимори
            player.src = `https://api.collapse.party/embed/anime/${shikimoriId}`;
            
            document.getElementById('player-modal').style.display = 'flex';
        }

        function closePlayer() {
            document.getElementById('anime-player').src = ""; 
            document.getElementById('player-modal').style.display = 'none';
        }

        loadAnime();
    </script>

</body>
</html>
