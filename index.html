<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой аниме-сайт с рабочим плеером</title>
    <!-- Подключаем стили Video.js -->
    <link href="https://vjs.zencdn.net/8.23.3/video-js.css" rel="stylesheet" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #ff6b6b; }
        #anime-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .anime-card {
            background: #1e1e1e;
            border-radius: 8px;
            width: 200px;
            padding: 15px;
            text-align: left;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .anime-card:hover { transform: scale(1.05); }
        .anime-card img {
            width: 100%;
            border-radius: 4px;
            height: 280px;
            object-fit: cover;
        }
        .anime-card h3 {
            font-size: 16px;
            margin: 10px 0 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* Модальное окно */
        #player-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 960px;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 28px;
            cursor: pointer;
            color: #ff6b6b;
            z-index: 10;
        }
        .close-btn:hover {
            color: #fff;
        }
        /* Видео-плеер занимает всю ширину */
        #anime-player {
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9; /* сохраняем пропорции */
            background: #000;
            border-radius: 6px;
            margin-top: 10px;
        }
        .error-msg {
            color: #ff6b6b;
            font-size: 18px;
            font-weight: bold;
        }
        /* Сообщение о загрузке */
        .loading {
            color: #aaa;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>🍿 Аниме-каталог</h1>
    <p>Нажмите на карточку, чтобы открыть плеер (демо-видео)</p>
    
    <div id="anime-container" class="loading">Загрузка данных...</div>

    <!-- Модальное окно с плеером -->
    <div id="player-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closePlayer()">&times;</span>
            <h2 id="modal-title">Название аниме</h2>
            <!-- Видео-элемент для Video.js -->
            <video id="anime-player" class="video-js vjs-default-skin" controls
                   poster="" data-setup='{"fluid": true, "controls": true, "autoplay": false}'>
                <source src="" type="video/mp4">
                <p class="vjs-no-js">Для просмотра видео включите JavaScript.</p>
            </video>
        </div>
    </div>

    <!-- Подключаем Video.js -->
    <script src="https://vjs.zencdn.net/8.23.3/video.min.js"></script>

    <script>
        // --- Глобальная переменная для плеера ---
        let player = null;

        // --- Загрузка списка аниме с Shikimori через прокси ---
        async function loadAnime() {
            try {
                const targetApiUrl = 'https://shikimori.one/api/animes?limit=12&order=popularity';
                const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(targetApiUrl);
                
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error('Ошибка сети или прокси');
                
                const data = await response.json();
                const container = document.getElementById('anime-container');
                container.innerHTML = '';
                container.classList.remove('loading');

                data.forEach(anime => {
                    const card = document.createElement('div');
                    card.className = 'anime-card';
                    
                    const title = anime.russian || anime.name;
                    const posterUrl = 'https://shikimori.one' + anime.image.original;
                    const year = anime.aired_on ? anime.aired_on.slice(0, 4) : 'Н/Д';

                    card.innerHTML = `
                        <img src="${posterUrl}" alt="${title}" loading="lazy">
                        <h3>${title}</h3>
                        <p>Год: ${year}</p>
                    `;
                    
                    // При клике открываем плеер с тестовым видео
                    card.addEventListener('click', () => {
                        // Вместо реального видео используем бесплатный тестовый ролик
                        // (вы можете заменить на свои ссылки, передавая их вторым параметром)
                        const demoVideo = 'https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/360/Big_Buck_Bunny_360_10s_1MB.mp4';
                        openPlayer(title, demoVideo, posterUrl);
                    });

                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                document.getElementById('anime-container').innerHTML = 
                    `<p class="error-msg">❌ Не удалось загрузить каталог. Попробуйте обновить страницу.</p>`;
            }
        }

        // --- Открытие плеера с указанным видео ---
        function openPlayer(title, videoUrl, posterUrl) {
            // Устанавливаем заголовок
            document.getElementById('modal-title').innerText = title;

            // Находим видео-элемент
            const videoElement = document.getElementById('anime-player');
            
            // Если плеер уже существует — уничтожаем его (чтобы пересоздать с новым источником)
            if (player) {
                player.dispose();
                player = null;
            }

            // Устанавливаем постер (заставку) и источник
            videoElement.poster = posterUrl || '';
            const source = videoElement.querySelector('source');
            source.src = videoUrl;

            // Создаём новый плеер Video.js
            player = videojs(videoElement, {
                fluid: true,
                controls: true,
                autoplay: false,
                techOrder: ['html5'] // используем только HTML5 (без Flash)
            });

            // Показываем модальное окно
            document.getElementById('player-modal').style.display = 'flex';
        }

        // --- Закрытие плеера ---
        function closePlayer() {
            if (player) {
                player.pause();      // останавливаем воспроизведение
                player.dispose();    // полностью удаляем плеер
                player = null;
            }
            // Очищаем источник, чтобы видео остановилось
            const videoElement = document.getElementById('anime-player');
            const source = videoElement.querySelector('source');
            source.src = '';
            videoElement.poster = '';
            // Скрываем модалку
            document.getElementById('player-modal').style.display = 'none';
        }

        // --- Запускаем загрузку каталога ---
        loadAnime();
    </script>

</body>
</html>
